<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Việt Anh – Trang cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{--bg:#eaf1ff;--ink:#0b1537;--mute:#55618f;--card:rgba(255,255,255,.7);--solid:#fff;--row:rgba(255,255,255,.8);--line:rgba(31,107,255,.14);--shadow:0 30px 80px -30px rgba(31,80,200,.45);--b1:#8db8ff;--b2:#7fe0ff;--b3:#ffd887;--bo:.75;--sheet:#fff;--hover:rgba(31,107,255,.4);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050917;--ink:#eef2ff;--mute:#9ba8d8;--card:rgba(15,23,56,.66);--solid:#0f1738;--row:rgba(255,255,255,.055);--line:rgba(142,172,255,.17);--shadow:0 30px 80px -30px rgba(0,0,0,.8);--b1:#1f4fd6;--b2:#0e86c9;--b3:#a8700a;--bo:.55;--sheet:#101838;--hover:rgba(90,150,255,.55)}}
:root[data-theme="dark"]{--bg:#050917;--ink:#eef2ff;--mute:#9ba8d8;--card:rgba(15,23,56,.66);--solid:#0f1738;--row:rgba(255,255,255,.055);--line:rgba(142,172,255,.17);--shadow:0 30px 80px -30px rgba(0,0,0,.8);--b1:#1f4fd6;--b2:#0e86c9;--b3:#a8700a;--bo:.55;--sheet:#101838;--hover:rgba(90,150,255,.55)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:28px 16px 40px;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;transition:background .4s,color .4s}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--bo);animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:360px;height:360px;background:var(--b1);top:-90px;left:-110px}
.bg i:nth-child(2){width:320px;height:320px;background:var(--b2);right:-100px;top:34%;animation-delay:-6s}
.bg i:nth-child(3){width:300px;height:300px;background:var(--b3);left:10%;bottom:-120px;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.card{position:relative;z-index:1;width:100%;max-width:440px;border-radius:34px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);overflow:hidden;animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
.banner{height:128px;background:radial-gradient(circle at 85% 20%,rgba(255,200,60,.85),transparent 45%),radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.6px) 0 0/16px 16px,linear-gradient(120deg,#1f5bff,#2fc4ff)}
.me{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px 24px;margin-top:-68px}
.av{position:relative;width:136px;height:136px;flex:none}
.av::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(#1f6bff,#2fc4ff,#ffb800,#1f6bff);animation:spin 7s linear infinite}
.av img{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid var(--solid);background:#fff}
h1{margin:18px 0 0;display:flex;align-items:center;gap:8px;font-size:clamp(25px,7.4vw,31px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.vf{width:26px;height:26px;flex:none}
.bio{margin:8px 0 0;max-width:30ch;color:var(--mute);font-size:15px;line-height:1.5}
.links{display:grid;gap:12px;padding:0 18px 22px}
.links hr{width:calc(100% - 16px);margin:2px auto;border:0;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border-radius:22px;background:var(--row);border:1px solid var(--line);color:inherit;text-decoration:none;font:inherit;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms + 250ms)}
.row:hover{transform:translateY(-2px);border-color:var(--hover);box-shadow:0 14px 30px -18px var(--hover)}
.row:active{transform:scale(.98)}
.row:focus-visible,.x:focus-visible,.copy:focus-visible,.tg:focus-visible{outline:3px solid #2fc4ff;outline-offset:3px}
.ic{display:grid;place-items:center;flex:none;width:50px;height:50px;border-radius:16px;color:#fff}
.ic svg{width:26px;height:26px;fill:currentColor}
.ic .st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fb{background:#1877f2}
.tk{background:#000}.tk svg{filter:drop-shadow(-1.5px -1px 0 #25f4ee) drop-shadow(1.5px 1px 0 #fe2c55)}
.th{background:#141414;font-size:31px;font-weight:800;line-height:1}
.bk{background:linear-gradient(135deg,#ffb800,#ff7a00)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:16px;font-weight:700}
.tx span{display:block;margin-top:2px;overflow:hidden;color:var(--mute);font-size:13.5px;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);cursor:pointer}
.tg svg{grid-area:1/1;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s,opacity .3s}
.tg .sun{opacity:0;transform:rotate(-90deg) scale(.5)}
[data-theme="dark"] .tg .sun{opacity:1;transform:none}
[data-theme="dark"] .tg .moon{opacity:0;transform:rotate(90deg) scale(.5)}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(4,9,28,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.ov.on{opacity:1;visibility:visible}
.sheet{position:relative;width:100%;max-width:360px;max-height:100%;overflow:auto;padding:22px 20px 20px;border-radius:30px;background:var(--sheet);border:1px solid var(--line);text-align:center;transform:translateY(24px) scale(.95);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.ov.on .sheet{transform:none}
.sheet h2{margin:0 36px 4px;font-size:18px;font-weight:800}
.sheet p{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.45}
.qr{padding:10px;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.qr img{display:block;width:100%;max-height:50vh;margin:0 auto;object-fit:contain}
.copy{width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;background:linear-gradient(120deg,#1f5bff,#2fc4ff);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:filter .2s,transform .15s}
.copy:active{transform:scale(.98)}
.copy.ok{background:linear-gradient(120deg,#12b76a,#34d399)}
.x{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:rgba(120,140,200,.18);color:var(--ink);cursor:pointer}
.x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
